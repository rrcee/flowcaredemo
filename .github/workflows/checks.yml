name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  firebase-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
        working-directory: functions
      - run: npm test
        working-directory: functions
      - name: Exercise callable APIs and deny-all rules
        env:
          GCLOUD_PROJECT: demo-flowcare
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
        run: npx -y firebase-tools@latest emulators:exec --only auth,firestore,functions --project demo-flowcare 'node functions/test/emulator-journey.js'
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: flowcare-offline-demo-signing-v1
      - run: gradle :composeApp:assembleDebug :composeApp:testPatientDebugUnitTest :composeApp:testHqDebugUnitTest :composeApp:testHospitalDebugUnitTest :composeApp:lintPatientDebug :composeApp:lintHqDebug :composeApp:lintHospitalDebug --stacktrace
      - name: Display debug signing certificate fingerprints
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$(find composeApp/build/outputs/apk/patient/debug -name "*.apk" -print -quit)"'
      - uses: actions/upload-artifact@v4
        with:
          name: FlowCare-Android-debug
          path: composeApp/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
  android-emulator:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: FlowCare-Android-debug
          path: apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            find apk -path '*hospital*' -name '*.apk' -exec adb install {} \;
            find apk -path '*patient*' -name '*.apk' -exec adb install {} \;
            find apk -path '*hq*' -name '*.apk' -exec adb install {} \;
            python scripts/emulator_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FlowCare-native-screenshots
          path: build/native-screenshots/
