name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: cd backend && pytest -q
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle :composeApp:assembleDebug :composeApp:testDebugUnitTest :composeApp:lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: FlowCare-Android-debug
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  ios-framework:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace
      - name: Build iOS simulator application
        run: |
          command -v xcodegen || brew install xcodegen
          cd iosApp
          xcodegen generate
          xcodebuild -project FlowCare.xcodeproj -scheme FlowCare -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build
      - uses: actions/upload-artifact@v4
        with:
          name: FlowCare-iOS-simulator-app
          path: iosApp/build/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: FlowCare-iOS-simulator-framework
          path: composeApp/build/bin/iosSimulatorArm64/debugFramework/
          if-no-files-found: error
  android-emulator:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: FlowCare-Android-debug
          path: apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            cd backend && uvicorn app:app --host 0.0.0.0 --port 8000 > /tmp/flowcare-api.log 2>&1 &
            adb install apk/composeApp-debug.apk
            python scripts/emulator_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FlowCare-native-screenshots
          path: build/native-screenshots/
