name: Publish Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/android-release.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FlowCare-Android-debug
          run-id: 43702615610
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist
      - name: Package verified offline apps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh run view 43702615610 --json conclusion --jq .conclusion)" = success
          for role in Patient Doctor Hospital; do
            role_key=$(printf '%s' "$role" | tr '[:upper:]' '[:lower:]')
            task_apk=$(find dist -type f -name "*-${role_key}-debug.apk" -print -quit)
            test -n "$task_apk"
            cp "$task_apk" "dist/FlowCare-${role}-v0.3.0-demo.apk"
          done
          cp docs/ANDROID_RELEASE.md dist/INSTALL.txt
          cd dist
          sha256sum FlowCare-*-v0.3.0-demo.apk > SHA256SUMS.txt
          zip -j FlowCare-Android-v0.3.0-demo.zip FlowCare-*-v0.3.0-demo.apk INSTALL.txt SHA256SUMS.txt
          zip -j FlowCare-icons-v0.3.0.zip ../branding/*.svg ../branding/FONT-LICENSE.txt
          sha256sum FlowCare-*.zip >> SHA256SUMS.txt
      - name: Publish APKs, bundle, icons and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v0.3.0-demo >/dev/null 2>&1 || gh release create v0.3.0-demo --target 7a65825b50f2acdb8ab4028dd6b51ea8f7533c2f --draft --prerelease --title 'FlowCare — three offline Android apps' --notes-file docs/ANDROID_RELEASE.md
          gh release upload v0.3.0-demo dist/FlowCare-*.apk dist/FlowCare-*.zip dist/SHA256SUMS.txt --clobber
          gh release edit v0.3.0-demo --draft=false --prerelease --notes-file docs/ANDROID_RELEASE.md
