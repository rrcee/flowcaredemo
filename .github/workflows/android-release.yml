name: Publish Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/android-release.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for tested builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run watch 43800837179 --exit-status --interval 30
      - uses: actions/download-artifact@v4
        with:
          name: FlowCare-Android-debug
          run-id: 43800837179
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist
      - name: Package verified offline apps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh run view 43800837179 --json conclusion --jq .conclusion)" = success
          for role in Patient HQ-Admin Care-Team; do
            case "$role" in Patient) role_key=patient;; HQ-Admin) role_key=hq;; Care-Team) role_key=hospital;; esac
            task_apk=$(find dist -type f -name "*-${role_key}-debug.apk" -print -quit)
            test -n "$task_apk"
            cp "$task_apk" "dist/FlowCare-${role}-v0.5.0-demo.apk"
          done
          cp docs/ANDROID_RELEASE.md dist/INSTALL.txt
          cd dist
          sha256sum FlowCare-*-v0.5.0-demo.apk > SHA256SUMS.txt
          zip -j FlowCare-Android-v0.5.0-demo.zip FlowCare-*-v0.5.0-demo.apk INSTALL.txt SHA256SUMS.txt
          zip -j FlowCare-icons-v0.5.0.zip ../branding/*.svg ../branding/FONT-LICENSE.txt
          sha256sum FlowCare-*.zip >> SHA256SUMS.txt
      - name: Publish APKs, bundle, icons and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v0.5.0-demo >/dev/null 2>&1 || gh release create v0.5.0-demo --target 9f4d1dc7daf9e1228aa9c6da4b877f63ecd67b01 --draft --prerelease --title 'FlowCare — Patient, Care Team and HQ Admin' --notes-file docs/ANDROID_RELEASE.md
          gh release upload v0.5.0-demo dist/FlowCare-*.apk dist/FlowCare-*.zip dist/SHA256SUMS.txt --clobber
          gh release edit v0.5.0-demo --draft=false --prerelease --notes-file docs/ANDROID_RELEASE.md
