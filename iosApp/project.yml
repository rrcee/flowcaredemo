name: FlowCare
options:
  bundleIdPrefix: com.flowcare
  deploymentTarget:
    iOS: "15.0"
targets:
  FlowCare:
    type: application
    platform: iOS
    sources: [FlowCareApp.swift]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: FlowCare
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    preBuildScripts:
      - name: Build Kotlin framework and synchronize resources
        script: |
          cd "$SRCROOT/.."
          gradle :composeApp:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowcare.demo
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../composeApp/build/bin/iosSimulatorArm64/debugFramework"
        OTHER_LDFLAGS: "$(inherited) -framework FlowCare"
